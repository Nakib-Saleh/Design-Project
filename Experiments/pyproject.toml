[project]
name = "culprit-vqa"
version = "0.0.1"
description = "Causal failure-attribution framework for multimodal VQA (scaffold)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]
kaggle = [
    "kaggle>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/culprit_vqa"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: requires network access and real credentials (e.g. Kaggle API); excluded by default via -m \"not integration\"",
]
